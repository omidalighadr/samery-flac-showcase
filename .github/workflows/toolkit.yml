name: Audio toolkit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
        working-directory: toolkit
  apple-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-test.txt
        working-directory: apple_music
      - run: python -m pytest tests -q
        working-directory: apple_music
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t samery-apple:test .
      - run: >-
          docker run --rm --network none --entrypoint python samery-apple:test
          -c "import sys; sys.path.insert(0, '/app/apple_music'); import bot;
          from gamdl.api import AppleMusicApi;
          from gamdl.api.wrapper import WrapperApi;
          from gamdl.interface import AppleMusicBaseInterface;
          from gamdl.downloader import AppleMusicBaseDownloader;
          print('Bot and external API imports passed; no account used.')"
