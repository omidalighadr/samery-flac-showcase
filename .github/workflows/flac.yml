name: FLAC conversion and CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - name: Install public runtime dependencies
        run: python -m pip install -r apple_music/requirements.txt
      - run: python -m pip check
      - run: python apple_music/demo.py
      - run: python -m unittest discover -s apple_music/tests -p 'test_*.py' -v
