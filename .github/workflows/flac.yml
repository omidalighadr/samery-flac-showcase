name: FLAC conversion and CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'mutagen>=1.47,<2'
      - run: python apple_music/demo.py
      - run: python -m unittest discover -s apple_music/tests -p test_download_cli.py -v
